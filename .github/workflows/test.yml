name: Run Tests

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: "swift test (macOS)"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and test the Swift package
        run: swift test

  thread-sanitizer:
    name: "swift test with Thread Sanitizer (macOS)"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test the Swift package with Thread Sanitizer
        run: swift test --sanitize=thread

  tests-ios:
    name: "test iOS"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | grep -oE '[0-9A-F-]{36}')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: >
          xcodebuild test
          -workspace MatomoTracker.xcworkspace
          -scheme MatomoTracker
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -configuration Debug

  builds:
    name: "build ${{ matrix.scheme }} (${{ matrix.platform }})"
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: MatomoTracker
            platform: tvOS
            destination: "generic/platform=tvOS Simulator"
          - scheme: MatomoTracker
            platform: visionOS
            destination: "generic/platform=visionOS Simulator"
          - scheme: ios
            platform: iOS
            destination: "generic/platform=iOS Simulator"
          - scheme: macos
            platform: macOS
            destination: "platform=macOS"
          - scheme: tvos
            platform: tvOS
            destination: "generic/platform=tvOS Simulator"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: >
          xcodebuild build
          -workspace MatomoTracker.xcworkspace
          -scheme '${{ matrix.scheme }}'
          -destination '${{ matrix.destination }}'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
